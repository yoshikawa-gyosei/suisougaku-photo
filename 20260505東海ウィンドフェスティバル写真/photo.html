<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>東海ウィンドフェスティバル 写真</title>

<style>

body {
    margin: 0;
    padding: 20px;
    background: #f5f7fa;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    color: #333;
}


/* 確認結果 */

#checkResult {
    max-width: 1200px;
    margin: 20px auto;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
    background: #eeeeee;
}


/* 写真一覧 */

.photos {
    max-width: 1200px;
    margin: auto;

    display: grid;
    grid-template-columns: repeat(4, 1fr);

    gap: 10px;
}

.photos img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;

    border-radius: 8px;

    cursor: pointer;
}

.photos img:hover {
    opacity: 0.8;
}


/* 大きく表示する画面 */

.modal {
    display: none;

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.92);

    justify-content: center;
    align-items: center;

    flex-direction: column;

    z-index: 1000;
}


/* 大きな写真 */

.modal img {
    max-width: 95%;
    max-height: 75%;

    object-fit: contain;

    border-radius: 5px;
}


/* 閉じるボタン */

.close {
    position: absolute;

    right: 20px;
    top: 5px;

    color: white;

    font-size: 40px;

    cursor: pointer;
}


/* 保存ボタン */

.saveButton {

    margin-top: 20px;

    padding: 14px 28px;

    background: white;

    color: #333;

    border: none;

    border-radius: 10px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    text-decoration: none;

    display: inline-block;
}

.saveButton:hover {
    background: #eeeeee;
}


/* スマホ */

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    .photos {
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
    }

    .modal img {
        max-width: 95%;
        max-height: 70%;
    }

    .saveButton {
        font-size: 16px;
        padding: 13px 22px;
    }

}

</style>

</head>


<body>


<h1>🎺 東海ウィンドフェスティバル 写真</h1>


<!-- 333枚の確認結果 -->

<div id="checkResult">
    写真を確認しています……
</div>


<!-- 写真一覧 -->

<div class="photos" id="photos"></div>


<!-- 大きく表示 -->

<div class="modal" id="modal">


    <!-- 閉じる -->

    <span class="close" onclick="closePhoto()">×</span>


    <!-- 大きな写真 -->

    <img id="largePhoto">


    <!-- 保存 -->

    <a
        id="saveButton"
        class="saveButton"
        href="#"
        target="_blank"
    >
        📥 写真を保存
    </a>


</div>


<script>


const photos =
    document.getElementById("photos");


const checkResult =
    document.getElementById("checkResult");


const modal =
    document.getElementById("modal");


const largePhoto =
    document.getElementById("largePhoto");


const saveButton =
    document.getElementById("saveButton");


// 写真の枚数

const totalPhotos = 333;


// CloudinaryのCloud Name

const cloudName = "avfwub8z";


// 入っていない写真

const missingPhotos = [];


// 確認した枚数

let checkedPhotos = 0;


// 現在の写真番号

let currentNumber = "";



/*
 * 写真を作る
 */

for (let i = 1; i <= totalPhotos; i++) {


    const number =
        String(i).padStart(3, "0");


    const img =
        document.createElement("img");


    const imageUrl =
        "https://res.cloudinary.com/" +
        cloudName +
        "/image/upload/01_" +
        number +
        ".jpg";


    img.src = imageUrl;


    /*
     * 写真が読み込めた
     */

    img.onload = function() {

        checkedPhotos++;

        checkComplete();

    };


    /*
     * 写真がない
     */

    img.onerror = function() {

        missingPhotos.push(number);

        checkedPhotos++;

        this.style.display = "none";

        checkComplete();

    };


    /*
     * 写真をタップ
     */

    img.onclick = function() {


        currentNumber = number;


        largePhoto.src = imageUrl;


        /*
         * 保存用URL
         *
         * Cloudinaryに
         * ダウンロード用として指定
         */

        saveButton.href =
            "https://res.cloudinary.com/" +
            cloudName +
            "/image/upload/fl_attachment/01_" +
            number +
            ".jpg";


        modal.style.display = "flex";

    };


    photos.appendChild(img);

}



/*
 * 333枚の確認
 */

function checkComplete() {


    if (checkedPhotos !== totalPhotos) {

        return;

    }


    if (missingPhotos.length === 0) {


        checkResult.textContent =
            "✅ 333枚すべての写真があります。";


        checkResult.style.background =
            "#d9f7df";


        checkResult.style.color =
            "#187a2f";


    } else {


        checkResult.textContent =
            "⚠️ 入っていない写真：" +
            missingPhotos.join("、");


        checkResult.style.background =
            "#ffe0e0";


        checkResult.style.color =
            "#c00000";

    }

}



/*
 * 写真を閉じる
 */

function closePhoto() {

    modal.style.display = "none";

}



/*
 * 黒い部分をタップして閉じる
 */

modal.onclick = function(event) {


    if (event.target === modal) {

        closePhoto();

    }

};


</script>


</body>

</html>
