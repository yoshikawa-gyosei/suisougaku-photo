<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>東海ウィンドフェスティバル | Photo Gallery</title>


<style>

/* =========================================================
   全体
========================================================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

    background: #f4f6f8;

    color: #263238;

}


/* =========================================================
   ヘッダー
========================================================= */

.header {

    background:
        linear-gradient(
            135deg,
            #172a46,
            #243f63
        );

    color: white;

    padding:
        38px 20px
        34px;

    text-align: center;

}


.header-sub {

    font-size: 11px;

    letter-spacing: 4px;

    opacity: 0.7;

    margin-bottom: 10px;

}


.header h1 {

    margin: 0;

    font-size: 27px;

    letter-spacing: 1px;

}


.header-date {

    margin-top: 12px;

    font-size: 13px;

    color:
        rgba(255,255,255,0.75);

}


/* =========================================================
   メイン
========================================================= */

.container {

    max-width: 1250px;

    margin: 0 auto;

    padding:
        35px 18px
        60px;

}


/* =========================================================
   写真グリッド
========================================================= */

.photos {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;

}


/* =========================================================
   写真
========================================================= */

.photos img {

    width: 100%;

    aspect-ratio: 4 / 3;

    object-fit: cover;

    border-radius: 9px;

    cursor: pointer;

    background: #ddd;

    display: block;

    transition:
        transform 0.2s,
        opacity 0.2s;

}


.photos img:hover {

    opacity: 0.9;

    transform:
        scale(1.015);

}


/* =========================================================
   読み込み中
========================================================= */

.loading {

    text-align: center;

    margin:
        25px 0;

    color: #7a858f;

    font-size: 13px;

    display: none;

}


/* =========================================================
   もっと見る
========================================================= */

.moreButton {

    display: block;

    margin:
        30px auto 0;

    padding:
        14px 32px;

    background: #263f62;

    color: white;

    border: none;

    border-radius: 10px;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

    transition:
        background 0.2s,
        transform 0.2s;

}


.moreButton:hover {

    background: #172a46;

}


.moreButton:active {

    transform:
        scale(0.97);

}


.moreButton:disabled {

    opacity: 0.6;

    cursor: default;

}


/* =========================================================
   メインに戻るボタン
========================================================= */

.backButton {

    display: block;

    width: fit-content;

    margin:
        35px auto 0;

    padding:
        13px 28px;

    background: #172a46;

    color: white;

    border-radius: 10px;

    font-size: 15px;

    font-weight: bold;

    text-decoration: none;

    transition:
        background 0.2s,
        transform 0.2s;

}


.backButton:hover {

    background: #243f63;

}


.backButton:active {

    transform:
        scale(0.97);

}


/* =========================================================
   写真拡大画面
========================================================= */

.modal {

    display: none;

    position: fixed;

    left: 0;

    top: 0;

    width: 100%;

    height: 100%;

    background:
        rgba(10,18,30,0.96);

    justify-content: center;

    align-items: center;

    flex-direction: column;

    z-index: 1000;

    touch-action: none;

}


/* =========================================================
   大きな写真
========================================================= */

.modal img {

    max-width: 94%;

    max-height: 78%;

    object-fit: contain;

    border-radius: 5px;

    user-select: none;

    -webkit-user-drag: none;

}


/* =========================================================
   閉じるボタン
========================================================= */

.close {

    position: absolute;

    right: 20px;

    top: 8px;

    color: white;

    font-size: 40px;

    font-weight: 300;

    cursor: pointer;

    line-height: 1;

    z-index: 10;

}


/* =========================================================
   前へ・次へ
========================================================= */

.photoPrev,
.photoNext {

    position: absolute;

    top: 50%;

    transform:
        translateY(-50%);

    width: 52px;

    height: 52px;

    border: none;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.14);

    color: white;

    font-size: 30px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    transition:
        background 0.2s,
        transform 0.2s;

}


.photoPrev:hover,
.photoNext:hover {

    background:
        rgba(255,255,255,0.25);

}


.photoPrev:active,
.photoNext:active {

    transform:
        translateY(-50%)
        scale(0.94);

}


.photoPrev {

    left: 18px;

}


.photoNext {

    right: 18px;

}


/* =========================================================
   保存ボタン
========================================================= */

.saveButton {

    margin-top: 20px;

    padding:
        13px 25px;

    background: white;

    color: #26384f;

    border-radius: 10px;

    font-size: 16px;

    font-weight: bold;

    text-decoration: none;

    display: inline-block;

    transition:
        background 0.2s,
        transform 0.2s;

}


.saveButton:hover {

    background: #eeeeee;

}


.saveButton:active {

    transform:
        scale(0.97);

}


/* =========================================================
   フッター
========================================================= */

.footer {

    background: #172a46;

    color:
        rgba(255,255,255,0.7);

    text-align: center;

    padding:
        30px 20px;

}


.footer-title {

    font-size: 12px;

    letter-spacing: 3px;

    margin-bottom: 9px;

}


.footer p {

    margin: 0;

    font-size: 11px;

}


/* =========================================================
   スマホ
========================================================= */

@media (max-width: 600px) {

    .header {

        padding:
            32px 15px
            28px;

    }


    .header-sub {

        font-size: 9px;

        letter-spacing: 3px;

    }


    .header h1 {

        font-size: 21px;

    }


    .header-date {

        font-size: 12px;

    }


    .container {

        padding:
            18px 8px
            45px;

    }


    .photos {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 5px;

    }


    .photos img {

        border-radius: 6px;

    }


    .modal img {

        max-width: 95%;

        max-height: 72%;

    }


    .photoPrev,
    .photoNext {

        width: 44px;

        height: 44px;

        font-size: 25px;

        background:
            rgba(255,255,255,0.10);

    }


    .photoPrev {

        left: 8px;

    }


    .photoNext {

        right: 8px;

    }


    .saveButton {

        font-size: 15px;

        padding:
            13px 22px;

    }


    .backButton {

        font-size: 14px;

        padding:
            12px 24px;

    }

}


/* =========================================================
   とても小さいスマホ
========================================================= */

@media (max-width: 360px) {

    .photos {

        gap: 4px;

    }


    .photoPrev,
    .photoNext {

        width: 40px;

        height: 40px;

        font-size: 22px;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     ヘッダー
========================================================= -->

<header class="header">

    <div class="header-sub">
        TOKAI GYOSEI
    </div>


    <h1>
        🎺 東海ウィンドフェスティバル
    </h1>


    <div class="header-date">
        2026.05.05　｜　フェニーチェ堺
    </div>

</header>



<!-- =========================================================
     メイン
========================================================= -->

<main class="container">


    <!-- 写真 -->

    <div
        class="photos"
        id="photos"
    ></div>


    <!-- 読み込み中 -->

    <div
        class="loading"
        id="loading"
    >
        写真を読み込んでいます…
    </div>


    <!-- もっと見る -->

    <button
        class="moreButton"
        id="moreButton"
        onclick="loadMorePhotos()"
    >
        もっと写真を見る ↓
    </button>


    <!-- メインに戻る -->

    <a
        href="../index.html"
        class="backButton"
    >
        ← メインに戻る
    </a>


</main>



<!-- =========================================================
     写真拡大
========================================================= -->

<div
    class="modal"
    id="modal"
>


    <!-- 閉じる -->

    <span
        class="close"
        onclick="closePhoto()"
    >
        ×
    </span>


    <!-- 前へ -->

    <button
        class="photoPrev"
        id="photoPrev"
        onclick="showPreviousPhoto(event)"
        aria-label="前の写真"
    >
        ‹
    </button>


    <!-- 大きな写真 -->

    <img
        id="largePhoto"
        alt="拡大写真"
    >


    <!-- 次へ -->

    <button
        class="photoNext"
        id="photoNext"
        onclick="showNextPhoto(event)"
        aria-label="次の写真"
    >
        ›
    </button>


    <!-- 保存 -->

    <a
        id="saveButton"
        class="saveButton"
        href="#"
        target="_blank"
        rel="noopener"
    >
        📥 写真を保存
    </a>


</div>



<!-- =========================================================
     フッター
========================================================= -->

<footer class="footer">

    <div class="footer-title">
        TOKAI GYOSEI
    </div>


    <p>
        Symphonic Band Photo Gallery
    </p>

</footer>



<script>


/* =========================================================
   ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
   ★
   ★   行事ごとに変更する場所
   ★
   ★   今後、行事を増やすときは基本ここだけ変更
   ★
   ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★ */


/* 行事名 */

const EVENT_NAME =
    "東海ウィンドフェスティバル";


/* 日付 */

const EVENT_DATE =
    "2026.05.05";


/* 会場 */

const EVENT_PLACE =
    "フェニーチェ堺";


/*
   Cloudinaryの写真名

   例：

   01_001.jpg
   01_002.jpg
   01_003.jpg

   の場合

   "01_"

*/

const PHOTO_PREFIX =
    "01_";


/*
   写真を探す最大番号

   実際の写真枚数ではありません。

   例えば実際には280枚でも、

   500

   としてOKです。

   存在しない写真は自動的に無視します。
*/

const MAX_PHOTOS =
    500;


/*
   一度に追加する枚数

   60枚ずつがおすすめ。
*/

const PHOTOS_PER_LOAD =
    60;


/*
   Cloudinary

   今使っているCloudinaryの名前
*/

const CLOUD_NAME =
    "avfwub8z";


/* =========================================================
   ★ ここから下は基本的に変更しない
========================================================= */


/* =========================================================
   ページ情報を自動設定
========================================================= */

document.title =
    EVENT_NAME +
    " | Photo Gallery";


document.querySelector(
    ".header h1"
).textContent =
    "🎺 " + EVENT_NAME;


document.querySelector(
    ".header-date"
).textContent =
    EVENT_DATE +
    "　｜　" +
    EVENT_PLACE;


/* =========================================================
   要素
========================================================= */

const photos =
    document.getElementById(
        "photos"
    );


const modal =
    document.getElementById(
        "modal"
    );


const largePhoto =
    document.getElementById(
        "largePhoto"
    );


const saveButton =
    document.getElementById(
        "saveButton"
    );


const moreButton =
    document.getElementById(
        "moreButton"
    );


const loading =
    document.getElementById(
        "loading"
    );


/* =========================================================
   現在の状態
========================================================= */


/*
   次に確認する写真番号
*/

let nextPhotoNumber =
    1;


/*
   今見ている写真の番号
*/

let currentPhotoIndex =
    -1;


/*
   実際に存在した写真だけ保存
*/

const photoData =
    [];


/*
   読み込み中かどうか
*/

let isLoading =
    false;


/* =========================================================
   Cloudinary URL
========================================================= */


/*
   一覧用の軽量画像

   f_auto
   → 対応している軽い画像形式を自動使用

   q_auto
   → Cloudinaryが画質と容量を自動調整

   w_500
   → 一覧用なので幅500px程度

   c_fill
   → 一覧を4:3に揃える
*/

function getThumbnailUrl(
    number
) {

    return (

        "https://res.cloudinary.com/" +

        CLOUD_NAME +

        "/image/upload/" +

        "f_auto,q_auto,w_500,c_fill,g_auto/" +

        PHOTO_PREFIX +

        number +

        ".jpg"

    );

}


/*
   拡大用

   クリックしたときはこちら。

   一覧より高画質。
*/

function getLargeImageUrl(
    number
) {

    return (

        "https://res.cloudinary.com/" +

        CLOUD_NAME +

        "/image/upload/" +

        "f_auto,q_auto/" +

        PHOTO_PREFIX +

        number +

        ".jpg"

    );

}


/*
   保存用
*/

function getDownloadUrl(
    number
) {

    return (

        "https://res.cloudinary.com/" +

        CLOUD_NAME +

        "/image/upload/" +

        "fl_attachment,f_auto,q_auto/" +

        PHOTO_PREFIX +

        number +

        ".jpg"

    );

}


/* =========================================================
   1枚の写真を確認
========================================================= */

function checkPhoto(
    photoNumber
) {

    return new Promise(
        function(resolve) {


            const number =
                String(
                    photoNumber
                ).padStart(
                    3,
                    "0"
                );


            const thumbnailUrl =
                getThumbnailUrl(
                    number
                );


            const largeUrl =
                getLargeImageUrl(
                    number
                );


            /*
               Imageを作って存在確認

               ここが今回の高速化ポイント。

               1枚ずつ待たず、
               複数枚を同時に確認します。
            */

            const img =
                new Image();


            img.onload =
                function() {


                    resolve({

                        number:
                            number,

                        thumbnail:
                            thumbnailUrl,

                        large:
                            largeUrl,

                        download:
                            getDownloadUrl(
                                number
                            )

                    });

                };


            img.onerror =
                function() {

                    resolve(
                        null
                    );

                };


            img.src =
                thumbnailUrl;

        }
    );

}


/* =========================================================
   60枚をまとめて確認
========================================================= */

async function loadMorePhotos() {


    /*
       二重クリック防止
    */

    if (
        isLoading
    ) {

        return;

    }


    /*
       最大番号まで確認した
    */

    if (
        nextPhotoNumber >
        MAX_PHOTOS
    ) {

        moreButton.style.display =
            "none";

        return;

    }


    isLoading =
        true;


    moreButton.disabled =
        true;


    loading.style.display =
        "block";


    /*
       今回確認する範囲
    */

    const start =
        nextPhotoNumber;


    const end =
        Math.min(
            start +
            PHOTOS_PER_LOAD -
            1,
            MAX_PHOTOS
        );


    /*
       ★重要★

       60枚を全部同時に確認する。

       前のコードのように

       001 → 完了
       002 → 完了
       003 → 完了

       と1枚ずつ待たない。
    */

    const promises = [];


    for (
        let i = start;
        i <= end;
        i++
    ) {

        promises.push(
            checkPhoto(i)
        );

    }


    /*
       全部の確認が終わるのを待つ
    */

    const results =
        await Promise.all(
            promises
        );


    /*
       実際に存在した写真だけ取り出す

       nullは存在しなかった写真
    */

    const validPhotos =
        results.filter(
            function(photo) {

                return photo !== null;

            }
        );


    /*
       順番通りに追加
    */

    for (
        const photo
        of validPhotos
    ) {


        const img =
            document.createElement(
                "img"
            );


        /*
           一覧用URL
        */

        img.src =
            photo.thumbnail;


        img.alt =
            EVENT_NAME +
            " 写真";


        /*
           lazy loading

           画面に近づいた写真だけ
           ブラウザが表示する
        */

        img.loading =
            "lazy";


        /*
           現在の配列番号
        */

        const index =
            photoData.length;


        /*
           データを保存
        */

        photoData.push(
            photo
        );


        /*
           クリックしたら拡大
        */

        img.onclick =
            function() {

                openPhoto(
                    index
                );

            };


        /*
           写真を画面に追加
        */

        photos.appendChild(
            img
        );

    }


    /*
       次の番号へ
    */

    nextPhotoNumber =
        end + 1;


    /*
       読み込み終了
    */

    loading.style.display =
        "none";


    isLoading =
        false;


    moreButton.disabled =
        false;


    /*
       今回の範囲で写真が1枚もなければ
       もう続きがないと判断
    */

    if (
        validPhotos.length === 0
    ) {

        moreButton.style.display =
            "none";

    }


    /*
       最大番号まで到達
    */

    if (
        nextPhotoNumber >
        MAX_PHOTOS
    ) {

        moreButton.style.display =
            "none";

    }

}


/* =========================================================
   写真を開く
========================================================= */

function openPhoto(
    index
) {


    if (
        index < 0
        ||
        index >= photoData.length
    ) {

        return;

    }


    currentPhotoIndex =
        index;


    const photo =
        photoData[
            currentPhotoIndex
        ];


    /*
       高画質画像
    */

    largePhoto.src =
        photo.large;


    /*
       保存
    */

    saveButton.href =
        photo.download;


    /*
       表示
    */

    modal.style.display =
        "flex";


    /*
       前後ボタン
    */

    updateNavigation();


    /*
       次の写真を先読み
    */

    preloadNextPhoto();

}


/* =========================================================
   前の写真
========================================================= */

function showPreviousPhoto(
    event
) {


    if (
        event
    ) {

        event.stopPropagation();

    }


    if (
        currentPhotoIndex <= 0
    ) {

        return;

    }


    openPhoto(
        currentPhotoIndex - 1
    );

}


/* =========================================================
   次の写真
========================================================= */

function showNextPhoto(
    event
) {


    if (
        event
    ) {

        event.stopPropagation();

    }


    /*
       今読み込まれている写真の
       最後まで来た場合
    */

    if (
        currentPhotoIndex >=
        photoData.length - 1
    ) {

        return;

    }


    openPhoto(
        currentPhotoIndex + 1
    );

}


/* =========================================================
   前後ボタンの状態
========================================================= */

function updateNavigation() {


    const prevButton =
        document.getElementById(
            "photoPrev"
        );


    const nextButton =
        document.getElementById(
            "photoNext"
        );


    /*
       最初の写真
    */

    if (
        currentPhotoIndex <= 0
    ) {

        prevButton.style.opacity =
            "0.25";

    }

    else {

        prevButton.style.opacity =
            "1";

    }


    /*
       最後の写真
    */

    if (
        currentPhotoIndex >=
        photoData.length - 1
    ) {

        nextButton.style.opacity =
            "0.25";

    }

    else {

        nextButton.style.opacity =
            "1";

    }

}


/* =========================================================
   次の写真を先読み
========================================================= */

function preloadNextPhoto() {


    const nextIndex =
        currentPhotoIndex + 1;


    if (
        nextIndex >=
        photoData.length
    ) {

        return;

    }


    const nextPhoto =
        photoData[
            nextIndex
        ];


    const preload =
        new Image();


    preload.src =
        nextPhoto.large;

}


/* =========================================================
   写真を閉じる
========================================================= */

function closePhoto() {

    modal.style.display =
        "none";


    largePhoto.src =
        "";

}


/* =========================================================
   黒い部分をクリックして閉じる
========================================================= */

modal.onclick =
    function(event) {


        if (
            event.target ===
            modal
        ) {

            closePhoto();

        }

    };


/* =========================================================
   PCキーボード操作
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {


        /*
           写真を開いていなければ何もしない
        */

        if (
            modal.style.display !==
            "flex"
        ) {

            return;

        }


        /*
           左矢印
        */

        if (
            event.key ===
            "ArrowLeft"
        ) {

            showPreviousPhoto();

        }


        /*
           右矢印
        */

        if (
            event.key ===
            "ArrowRight"
        ) {

            showNextPhoto();

        }


        /*
           Esc
        */

        if (
            event.key ===
            "Escape"
        ) {

            closePhoto();

        }

    }
);


/* =========================================================
   スマホ左右スワイプ
========================================================= */

let touchStartX =
    0;

let touchStartY =
    0;


modal.addEventListener(
    "touchstart",
    function(event) {


        if (
            event.touches.length !== 1
        ) {

            return;

        }


        touchStartX =
            event.touches[0].clientX;


        touchStartY =
            event.touches[0].clientY;

    },
    {
        passive: true
    }
);


modal.addEventListener(
    "touchend",
    function(event) {


        if (
            event.changedTouches.length !== 1
        ) {

            return;

        }


        const endX =
            event.changedTouches[0].clientX;


        const endY =
            event.changedTouches[0].clientY;


        const diffX =
            endX -
            touchStartX;


        const diffY =
            endY -
            touchStartY;


        /*
           縦方向の操作なら無視
        */

        if (
            Math.abs(diffX) < 50
            ||
            Math.abs(diffX) <
            Math.abs(diffY)
        ) {

            return;

        }


        /*
           左へスワイプ
           → 次の写真
        */

        if (
            diffX < 0
        ) {

            showNextPhoto();

        }


        /*
           右へスワイプ
           → 前の写真
        */

        else {

            showPreviousPhoto();

        }

    },
    {
        passive: true
    }
);


/* =========================================================
   最初の60枚を読み込む
========================================================= */

loadMorePhotos();


</script>
