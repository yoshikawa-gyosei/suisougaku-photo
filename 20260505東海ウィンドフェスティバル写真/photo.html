<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>東海ウィンドフェスティバル 写真</title>

<style>

body {
    margin: 0;
    padding: 20px;
    background: #f5f7fa;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    color: #333;
}

/* 確認結果 */

#checkResult {
    max-width: 1200px;
    margin: 20px auto;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
    background: #eeeeee;
}


/* 写真一覧 */

.photos {
    max-width: 1200px;
    margin: auto;

    display: grid;
    grid-template-columns: repeat(4, 1fr);

    gap: 10px;
}

.photos img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;

    border-radius: 8px;

    cursor: pointer;
}

.photos img:hover {
    opacity: 0.8;
}


/* 大きく表示 */

.modal {
    display: none;

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.9);

    justify-content: center;
    align-items: center;
}

.modal img {
    max-width: 95%;
    max-height: 90%;
}

.close {
    position: absolute;

    right: 25px;
    top: 10px;

    color: white;

    font-size: 40px;

    cursor: pointer;
}


/* スマホ */

@media (max-width: 600px) {

    .photos {
        grid-template-columns: repeat(2, 1fr);
    }

}

</style>

</head>


<body>

<h1>🎺 東海ウィンドフェスティバル 写真</h1>


<!-- 写真の確認結果 -->

<div id="checkResult">
    写真を確認しています……
</div>


<!-- 写真一覧 -->

<div class="photos" id="photos"></div>


<!-- 大きく表示 -->

<div class="modal" id="modal">

    <span class="close" onclick="closePhoto()">×</span>

    <img id="largePhoto">

</div>


<script>

const photos = document.getElementById("photos");

const checkResult = document.getElementById("checkResult");


// 写真の枚数
const totalPhotos = 333;


// CloudinaryのCloud Name
const cloudName = "avfwub8z";


// 入っていない写真
const missingPhotos = [];


// 確認が終わった枚数
let checkedPhotos = 0;


// 写真を作る
for (let i = 1; i <= totalPhotos; i++) {

    const number = String(i).padStart(3, "0");

    const img = document.createElement("img");

    const imageUrl =
        "https://res.cloudinary.com/" +
        cloudName +
        "/image/upload/01_" +
        number +
        ".jpg";


    img.src = imageUrl;

    img.loading = "lazy";


    /*
     * 写真が正常に読み込めた場合
     */

    img.onload = function() {

        checkedPhotos++;

        checkComplete();

    };


    /*
     * 写真がCloudinaryにない場合
     */

    img.onerror = function() {

        missingPhotos.push(number);

        checkedPhotos++;

        // 写真は表示しない
        this.style.display = "none";

        checkComplete();

    };


    /*
     * 写真をクリックした場合
     */

    img.onclick = function() {

        document.getElementById("largePhoto").src = this.src;

        document.getElementById("modal").style.display = "flex";

    };


    photos.appendChild(img);

}


/*
 * 333枚の確認が終わったら結果を表示
 */

function checkComplete() {

    if (checkedPhotos === totalPhotos) {

        if (missingPhotos.length === 0) {

            checkResult.textContent =
                "✅ 333枚すべての写真がCloudinaryにあります。";

            checkResult.style.background = "#d9f7df";

            checkResult.style.color = "#187a2f";

        } else {

            checkResult.textContent =
                "⚠️ Cloudinaryにない写真：" +
                missingPhotos.join("、");

            checkResult.style.background = "#ffe0e0";

            checkResult.style.color = "#c00000";

        }

    }

}


/*
 * 大きく表示を閉じる
 */

function closePhoto() {

    document.getElementById("modal").style.display = "none";

}

</script>


</body>

</html>
