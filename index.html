<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>東海大学付属大阪仰星高等学校吹奏楽部 PHOTO GALLERY</title>


<style>

/* =========================
   全体
========================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

    background: #f4f6f8;

    color: #263238;

}


/* =========================
   ヘッダー
========================= */

.header {

    background:
        linear-gradient(
            135deg,
            #172a46,
            #243f63
        );

    color: white;

    padding:
        55px 20px
        45px;

    text-align: center;

}


.header-sub {

    font-size: 13px;

    letter-spacing: 4px;

    opacity: 0.75;

    margin-bottom: 12px;

}


.header h1 {

    margin: 0;

    font-size: 30px;

    letter-spacing: 1px;

}


.header-description {

    margin:
        16px auto
        0;

    max-width: 500px;

    line-height: 1.8;

    font-size: 14px;

    color: rgba(255,255,255,0.82);

}


/* =========================
   メイン
========================= */

.container {

    max-width: 850px;

    margin:
        0 auto;

    padding:
        45px 18px
        70px;

}


/* =========================
   セクションタイトル
========================= */

.section-title {

    text-align: center;

    margin-bottom: 30px;

}


.section-title span {

    display: block;

    font-size: 12px;

    letter-spacing: 3px;

    color: #a07a35;

    font-weight: bold;

    margin-bottom: 7px;

}


.section-title h2 {

    margin: 0;

    font-size: 24px;

    color: #26384f;

}


/* =========================
   行事カード
========================= */

.event-card {

    background: white;

    border-radius: 18px;

    padding: 26px;

    margin-bottom: 18px;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,0.07);

    display: flex;

    align-items: center;

    gap: 20px;

    transition:
        transform 0.2s,
        box-shadow 0.2s;

}


.event-card:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 9px 25px
        rgba(0,0,0,0.11);

}


/* =========================
   行事の代表写真
========================= */

.event-icon {

    width: 100px;

    height: 75px;

    flex-shrink: 0;

    border-radius: 12px;

    overflow: hidden;

    background: #eef2f7;

}


.event-icon img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

}


/* =========================
   行事情報
========================= */

.event-info {

    flex: 1;

}


.event-info h3 {

    margin:
        0 0 7px;

    font-size: 19px;

    color: #26384f;

}


.event-info p {

    margin: 0;

    font-size: 14px;

    color: #7a858f;

    line-height: 1.6;

}


/* =========================
   ボタン
========================= */

.btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    padding:
        13px 20px;

    min-width: 120px;

    background: #263f62;

    color: white;

    text-decoration: none;

    border: none;

    border-radius: 10px;

    font-weight: bold;

    font-size: 14px;

    cursor: pointer;

    transition:
        background 0.2s,
        transform 0.2s;

}


.btn:hover {

    background: #172a46;

}


.btn:active {

    transform:
        scale(0.97);

}


/* =========================
   フッター
========================= */

.footer {

    text-align: center;

    padding:
        35px 20px;

    background: #172a46;

    color: rgba(255,255,255,0.7);

}


.footer-title {

    font-size: 13px;

    letter-spacing: 3px;

    margin-bottom: 10px;

}


.footer p {

    margin: 0;

    font-size: 12px;

}


/* =========================
   スマホ
========================= */

@media (max-width: 600px) {


    .header {

        padding:
            42px 18px
            38px;

    }


    .header-sub {

        font-size: 11px;

        letter-spacing: 3px;

    }


    .header h1 {

        font-size: 24px;

    }


    .header-description {

        font-size: 13px;

    }


    .container {

        padding:
            35px 12px
            55px;

    }


    .section-title {

        margin-bottom: 22px;

    }


    .section-title h2 {

        font-size: 21px;

    }


    .event-card {

        padding: 20px;

        border-radius: 16px;

        gap: 14px;

    }


    .event-icon {

        width: 85px;

        height: 64px;

        border-radius: 10px;

    }


    .event-info h3 {

        font-size: 16px;

    }


    .event-info p {

        font-size: 12px;

    }


    .btn {

        min-width: auto;

        padding:
            11px 14px;

        font-size: 12px;

    }

}


/* =========================
   かなり小さいスマホ
========================= */

@media (max-width: 400px) {


    .event-card {

        flex-wrap: wrap;

    }


    .event-info {

        min-width:
            calc(100% - 65px);

    }


    .btn {

        width: 100%;

    }

}

</style>

</head>


<body>


<!-- =========================

<header class="header">

<script>


/* =========================
   パスワード確認
========================= */

function checkPassword(

    correctPassword,

    folderPath

) {


    const input = prompt(

        "写真を見るにはパスワードを入力してください。"

    );


    /* キャンセル */

    if (input === null) {

        return;

    }


    /* 正しいパスワード */

    if (input === correctPassword) {


        window.location.href =
            folderPath;


    }


    /* 間違い */

    else {


        alert(

            "パスワードが違います。\n" +
            "もう一度入力してください。"

        );

    }

}

</script>
