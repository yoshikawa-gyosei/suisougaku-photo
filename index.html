<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>東海大仰星吹奏楽部写真</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Hiragino Kaku Gothic ProN",
                "Yu Gothic",
                sans-serif;

            margin: 0;
            padding: 20px 15px;

            background: #f5f7fa;
            color: #333;
        }


        .page {

            max-width: 800px;
            margin: 0 auto;

        }


        h1 {

            text-align: center;

            color: #2c3e50;

            margin: 10px 0 10px;

            font-size: 28px;

        }


        .description {

            text-align: center;

            color: #666;

            margin-bottom: 30px;

            line-height: 1.7;

        }


        .event-card {

            background: white;

            padding: 20px;

            margin-bottom: 16px;

            border-radius: 14px;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.08);

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

        }


        .event-info {

            flex: 1;

        }


        .event-info h2 {

            margin: 0 0 7px;

            font-size: 18px;

            color: #34495e;

        }


        .event-info p {

            margin: 0;

            color: #777;

            font-size: 14px;

        }


        .btn {

            display: inline-block;

            padding: 12px 20px;

            background: #e67e22;

            color: white;

            text-decoration: none;

            border: none;

            border-radius: 9px;

            font-weight: bold;

            font-size: 15px;

            cursor: pointer;

            white-space: nowrap;

        }


        .btn:hover {

            background: #d35400;

        }


        /* スマホ */

        @media (max-width: 600px) {

            body {

                padding: 15px 10px;

            }


            h1 {

                font-size: 23px;

            }


            .description {

                font-size: 14px;

                margin-bottom: 20px;

            }


            .event-card {

                padding: 16px;

                flex-direction: column;

                align-items: stretch;

            }


            .event-info h2 {

                font-size: 17px;

            }


            .event-info p {

                font-size: 13px;

            }


            .btn {

                width: 100%;

                text-align: center;

                padding: 13px;

            }

        }

    </style>

</head>


<body>


<div class="page">


    <h1>🎺 東海大仰星吹奏楽部写真</h1>


    <p class="description">

        見たい行事を選択し、パスワードを入力してください。

    </p>



    <!-- ========================= -->
    <!-- 東海ウィンドフェスティバル -->
    <!-- ========================= -->


    <div class="event-card">


        <div class="event-info">


            <h2>🎺 東海ウィンドフェスティバル</h2>


            <p>

                2026/05/05　フェニーチェ堺

            </p>


        </div>



        <button

            class="btn"

            onclick="

                checkPassword(

                    '東海',

                    '20260505東海ウィンドフェスティバル写真/photo.html'

                )

            "

        >

            写真を見る

        </button>


    </div>



    <!-- ========================= -->
    <!-- 行事を追加する場合 -->
    <!-- ========================= -->


    <!--

    <div class="event-card">


        <div class="event-info">


            <h2>🎷 ○○コンサート</h2>


            <p>

                2026/06/20　○○ホール

            </p>


        </div>


        <button

            class="btn"

            onclick="

                checkPassword(

                    'パスワード',

                    '20260620○○コンサート写真/photo.html'

                )

            "

        >

            写真を見る

        </button>


    </div>

    -->


</div>



<script>


    function checkPassword(correctPassword, folderPath) {


        const input = prompt(

            "パスワードを入力してください："

        );


        // キャンセル

        if (input === null) {

            return;

        }


        // パスワードが正しい

        if (input === correctPassword) {


            window.location.href = folderPath;


        }


        // パスワードが間違っている

        else {


            alert(

                "パスワードが違います。\nもう一度入力してください。"

            );

        }

    }


</script>


</body>

</html>
